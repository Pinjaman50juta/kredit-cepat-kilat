<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{ background:#ffffff; height:100vh; display:flex; justify-content:center; align-items:center; font-family: Arial, sans-serif; overflow:hidden; }
  .loading-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gear-box{ width:100px; height:100px; position:relative; display:flex; align-items:center; justify-content:center; animation: besarKecil 1.6s ease-in-out infinite; }
  .gear-outer{ position:absolute; width:100%; height:100%; animation: putar 2s linear infinite; z-index:1; }
  .gear-outer span{ position:absolute; width:0;height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:18px solid #000; left:50%; top:0; margin-left:-10px; transform-origin:50% 50px; }
  .gear-center{ width:62px; height:62px; background:white; border:2.5px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:2; position:relative; overflow:hidden; }
  .gear-center img{ width:42px; height:42px; object-fit:contain; }
  h2{ margin-top:24px; color:#5a3ca6; font-style:italic; font-weight:900; font-size:24px; letter-spacing:0.5px; text-align:center; }
  h2.second{ margin-top:8px; }
  @keyframes putar{ to{ transform: rotate(360deg); } }
  @keyframes besarKecil{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }
</style>
</head>
<body>

<div class="loading-wrap">
  <div class="gear-box">
    <div class="gear-outer" id="gear"></div>
    <div class="gear-center">
      <img src="https://bankrakyatindonesia822044977.wordpress.com/wp-content/uploads/2026/10/ezgif-cropped.gif" alt="logo">
    </div>
  </div>
  <h2>PT. KREDIT</h2>
  <h2 class="second">CEPAT CAIR INDONESIA</h2>
</div>

<script>
  const gear = document.getElementById('gear');
  for(let i=0;i<8;i++){ let s=document.createElement('span'); gear.appendChild(s); }
  document.querySelectorAll('.gear-outer span').forEach((el, i)=>{
    el.style.transform = `rotate(${i*45}deg)`;
    el.style.transformOrigin = `50% 50px`;
  });
  // FIX 2: GANTI TUJUAN JANGAN KE INDEX.HTML LAGI
  setTimeout(()=>{ window.location.href = "0.html"; }, 3200);
</script>

</body>
